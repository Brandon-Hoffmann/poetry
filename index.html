<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandon Karl Hoffmann Poetry</title>
    <meta name="description" content="Brandon Karl Hoffmann — poetry. Creative ideations. Based in College Park, Maryland.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #b3b3b3;
        --accent: #00d1ff;
        --line: #333333;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-weight: 400;
        color: var(--text);
        line-height: 1.6;
        background: var(--bg);
        text-align: center;
    }

    .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 20px;
    }

    header {
        padding: 72px 0 32px;
    }

    header h1 {
        font-weight: 500;
        font-size: clamp(1.7rem, 7vw, 3rem);
        line-height: 1.1;
        letter-spacing: 2px;
        white-space: nowrap;
    }

    header .tagline {
        font-weight: 400;
        font-style: italic;
        font-size: 1.6rem;
        color: var(--muted);
        margin-top: 8px;
        letter-spacing: 1px;
    }

    .intro {
        padding: 8px 0 32px;
    }

    .intro p {
        color: var(--muted);
        margin-bottom: 10px;
        font-size: 1.3rem;
    }

    .intro em {
        color: var(--text);
        font-style: italic;
    }

    .links {
        display: flex;
        gap: 28px;
        justify-content: center;
        flex-wrap: wrap;
        padding-bottom: 48px;
    }

    .links a {
        color: var(--muted);
        text-decoration: none;
    }

    .links .icon {
        width: 56px;
        height: 56px;
        border: 1px solid var(--line);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .links .icon svg {
        width: 26px;
        height: 26px;
        fill: var(--text);
    }

    .links a:hover {
        color: var(--accent);
    }

    .links a:hover .icon {
        border-color: var(--accent);
    }

    .links a:hover .icon svg {
        fill: var(--accent);
    }

    .gallery {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding-bottom: 56px;
    }

    @media (min-width: 640px) {
        .gallery {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
    }

    .gallery a {
        display: block;
    }

    .gallery img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
    }

    .gallery a:hover img {
        opacity: 0.85;
    }

    footer {
        padding: 28px 0 48px;
        color: var(--muted);
        font-size: 0.9rem;
        border-top: 1px solid var(--line);
    }

    footer a {
        color: var(--muted);
        text-decoration: none;
    }

    footer a:hover {
        color: var(--accent);
    }
    </style>
</head>
<body>

    <header>
        <div class="wrap">
            <h1>Brandon Karl Hoffmann</h1>
            <p class="tagline">Creative ideations</p>
        </div>
    </header>

    <section class="intro">
        <div class="wrap">
            <p>
                Lover of the 
                <em>try everything while you can</em>
                 mentality.
            </p>
            <p>I enjoy attempting to build thought-provoking word messes into cleaner verse.</p>
            <p>Based in College Park, Maryland.</p>
        </div>
